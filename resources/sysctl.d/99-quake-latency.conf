# fair queueing + bbr: lower bufferbloat / jitter while something else uses the link
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
# bigger udp socket buffers, avoids drops on 77fps+ packet bursts
net.core.rmem_default=1048576
net.core.wmem_default=1048576
net.core.netdev_max_backlog=4096
# only swap when really out of memory
vm.swappiness=10
